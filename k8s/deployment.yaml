apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostfound-deployment
  labels:
    app: lostfound
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lostfound
  template:
    metadata:
      labels:
        app: lostfound
    spec:
      containers:
        - name: lostfound
          image: ghcr.io/skit-devops-2026/devops-24eskcs130:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
